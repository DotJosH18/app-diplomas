<!-- PARTE: AYUDA · recorrido guiado con Magnus y aviso de bienvenida
     Se pega en la página desde index.html (busca "@incluir partes/ayuda/recorrido.html")
     Estilos: css/5-ayuda/recorrido.css, css/5-ayuda/magnus.css
     Lógica:  js/ayuda.js, js/magnus.js -->
<!-- ==================== RECORRIDO GUIADO (con Magnus) ====================
     Una capa oscura con un "hueco" sobre el elemento que se explica y,
     al lado, Magnus (la mascota de UNICAH) con un globo de diálogo.
     Lo maneja ayuda.js. Las imágenes de Magnus están en img/. -->
<div id="recorrido" class="recorrido oculto" role="dialog" aria-modal="true" aria-labelledby="recorrido-titulo">
  <div class="recorrido__foco" aria-hidden="true"></div>
  <div class="recorrido__toque" aria-hidden="true"></div>   <!-- el círculo cuando Magnus "toca" algo -->
  <div class="recorrido__globo">
    <!-- Magnus: la "caja" se voltea (espejo) para mirar hacia el elemento.
         Su cara la pone magnus.js y se anima en estilos.css ("MAGNUS ANIMADO") -->
    <span class="recorrido__magnus-caja"><span class="magnus recorrido__magnus" aria-hidden="true"></span></span>
    <div class="recorrido__burbuja">
      <p class="recorrido__paso"><span class="recorrido__quien">Magnus</span> · <span id="recorrido-numero"></span></p>
      <h3 id="recorrido-titulo" class="recorrido__titulo"></h3>
      <p id="recorrido-texto" class="recorrido__texto"></p>
      <div class="recorrido__botones">
        <button type="button" id="recorrido-salir" class="boton boton--texto"><span class="boton__texto">Salir</span></button>
        <span class="recorrido__espacio"></span>
        <button type="button" id="recorrido-anterior" class="boton boton--chico" aria-label="Paso anterior"><span class="icono" aria-hidden="true">arrow_back</span></button>
        <button type="button" id="recorrido-siguiente" class="boton boton--chico boton--principal"><span class="boton__texto">Siguiente</span><span class="icono" aria-hidden="true">arrow_forward</span></button>
      </div>
    </div>
  </div>
</div>

<!-- Aviso de bienvenida (solo la primera vez en este navegador) -->
<div id="bienvenida" class="bienvenida oculto" role="status">
  <span class="magnus bienvenida__magnus" aria-hidden="true"></span>
  <div class="bienvenida__contenido">
    <p><strong>¡Hola! Soy Magnus.</strong> ¿Es tu primera vez aquí? Te enseño cómo funciona en 1 minuto.</p>
    <div class="bienvenida__botones">
      <button type="button" id="bienvenida-no" class="boton boton--texto">Ahora no</button>
      <button type="button" id="bienvenida-si" class="boton boton--chico boton--principal"><span class="icono" aria-hidden="true">play_arrow</span><span class="boton__texto">¡Vamos!</span></button>
    </div>
  </div>
</div>
